                    const scA = a.scorecard || a;
                    const scB = b.scorecard || b;

                    const desempate = compararTarjetasMejor18(
                        scA,
                        scB,
                        field
                    );

                    if (desempate !== 0) {
                        return desempate;
                    }
                }

                const scoreA = n(a.score) ?? 999999;
                const scoreB = n(b.score) ?? 999999;

                if (scoreA !== scoreB) {
                    return scoreA - scoreB;
                }

                return String(a.display_name || "")
                    .localeCompare(
                        String(b.display_name || ""),
                        "es"
                    );

            const ordenarScratch = (a, b) => {

                if (esMejor18) {

                    const scB = b.scorecard || b;

                        scA,
                        scB,
                        "gross"
                    );

                    if (desempate !== 0) {
                        return desempate;
                    }

                const scoreA =
                    scoreScratchSerie(a, tipo) ?? 9999;

                    scoreScratchSerie(b, tipo) ?? 9999;

        function configurarBuscadorApproach(inputId) {
            const input = el(inputId);
            const box = document.querySelector(`.approach-suggestions[data-for="${inputId}"]`);
            if (!input || !box) return;

            if (input.dataset.approachReady === "1") return;
            input.dataset.approachReady = "1";

            input.addEventListener("input", () => {
                const q = normalizarTextoClave(input.value);

                if (!q) {
                    box.style.display = "none";
                    box.innerHTML = "";
                    return;
                }

                const matches = jugadoresApproach
                    .filter(nombre => normalizarTextoClave(nombre).includes(q))
                    .slice(0, 4);

                if (!matches.length) {
                    box.style.display = "none";
                    box.innerHTML = "";
                    return;

                box.innerHTML = matches.map(nombre => `
                    <div class="approach-suggestion" data-nombre="${esc(nombre)}">
                        ${esc(nombre)}
                    </div>
                `).join("");

                box.style.display = "block";

            box.addEventListener("click", (ev) => {
                const item = ev.target.closest(".approach-suggestion");
                if (!item) return;

                input.value = item.dataset.nombre || "";

                renderTodo();

            input.addEventListener("change", () => {
                guardarPremiosEspeciales();

        // El archivo del logo debe quedar junto a este HTML.

        function renderPrintMembrete(subtitulo = "") {

        function datosOrdenCategoria(nombre) {
            const texto = String(nombre || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .replace(/\s+/g, " ")
                .trim();
            const meta = categoriaMetaPorNombre(nombre) || categorias.find(c =>
                String(c?.name || "")
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .toLowerCase()
                    .replace(/\s+/g, " ")
                    .trim() === texto
            );
            const genero = normalizarGenero(meta?.gender || nombre);

            // En torneos NEW la categoría femenina puede llamarse simplemente
            // "Rojas". Debe imprimirse antes de todas las categorías de caballeros.
            // Para legacy conservamos el criterio histórico existente.
            const esDamas =
                genero === "female" ||
                texto.includes("dama") ||
                (
                    torneoUsaSistemaNuevo() &&
                    (texto.includes("roja") || texto.includes("rojas"))
                );
            const numeroValido = value => value == null || value === "" ? null : n(value);
            let maximo = numeroValido(meta?.playing_handicap_max) ?? numeroValido(meta?.index_max);
            let minimo = numeroValido(meta?.playing_handicap_min) ?? numeroValido(meta?.index_min);

            // Respaldo para los nombres habituales, incluso si la categoría de la
            // tarjeta no encuentra su metadata por una diferencia de escritura.
            let ordenHabitual = null;
            if (!esDamas) {
                if (/blancas?\s*b\b/.test(texto)) ordenHabitual = 1;
                else if (/blancas?\s*a\b/.test(texto)) ordenHabitual = 2;
                else if (texto.includes("amarilla")) ordenHabitual = 3;
                else if (texto.includes("negra")) ordenHabitual = 4;
            }

            // Último respaldo: si el nombre contiene un rango, también se utiliza.
            if (maximo == null || minimo == null) {
                const nums = texto.match(/-?\d+(?:[.,]\d+)?/g)?.map(v => Number(v.replace(",", "."))) || [];
                if (minimo == null && nums.length) minimo = nums[0];
                if (maximo == null && nums.length > 1) maximo = nums[nums.length - 1];
            }

            return {
                esDamas,
                ordenHabitual,
                maximo: maximo ?? -9999,
                minimo: minimo ?? -9999
            };
        }

        // Damas primero. Dentro de cada género: rango más alto a rango más bajo.
        function compararCategoriasPremios(a, b) {
            const da = datosOrdenCategoria(a);
            const db = datosOrdenCategoria(b);
            if (da.esDamas !== db.esDamas) return da.esDamas ? -1 : 1;
            if (!da.esDamas && da.ordenHabitual != null && db.ordenHabitual != null) {
                return da.ordenHabitual - db.ordenHabitual;
            }
            if (da.maximo !== db.maximo) return db.maximo - da.maximo;
            if (da.minimo !== db.minimo) return db.minimo - da.minimo;
            if (da.ordenHabitual != null || db.ordenHabitual != null) {
                return (da.ordenHabitual ?? 999) - (db.ordenHabitual ?? 999);
            }
            return String(a).localeCompare(String(b), "es");
        }

                    .slice(0, limite)
                    .reverse()
                    .forEach((s, idx, arr) => {
                        const pos = arr.length - idx;
                        out += renderGanadorLinea(s, pos, "gross");
                    });

                return out;
            }

            function renderPrintCategoria(cat, items) {
                const ganadores = items
                    .slice()
                    .sort((a, b) =>
                        esFourballAmericana()
                            ? compareFourballAmericana(a, b)
                            : compareScore(a, b, "net")
                    )
                    .slice(0, top)
                    .reverse();

                if (!ganadores.length) return "";

                let out = `<div class="print-category">${esc(cat)}</div>`;

                ganadores.forEach((s, idx, arr) => {
                    const pos = arr.length - idx;
                    out += renderGanadorLinea(s, pos, "net");
                });

                return out;
            }

            const grupos = new Map();
            scorecards
                .filter(s => {
                    const catName = String(s.category_name || "").toLowerCase();
                    return (s.card_status === "valid" || s.card_status === "cargada") &&
                        s.category_name &&
                        n(s.net) != null &&
                        !catName.includes("scratch") &&
                        !catName.includes("scrach") &&
                        !scratchWinnerIds.has(String(s.id));
                })
                .forEach(s => {
                    const key = s.category_name || "Sin categoría";
                    if (!grupos.has(key)) grupos.set(key, []);
                    grupos.get(key).push(s);
                });

            const categoriasCab = [...grupos.entries()]
                .filter(([cat]) => {
                    const meta = categoriaMetaPorNombre(cat);
                    const texto = String(cat || "").toLowerCase();
                    return normalizarGenero(meta?.gender || cat) !== "female" && !texto.includes("dama");
                })
                .sort((a, b) => ordenCategoria(a[0]) - ordenCategoria(b[0]) || a[0].localeCompare(b[0], "es"));

            const categoriasDam = [...grupos.entries()]
                .filter(([cat]) => {
                    const meta = categoriaMetaPorNombre(cat);
                    const texto = String(cat || "").toLowerCase();
                    return normalizarGenero(meta?.gender || cat) === "female" || texto.includes("dama");
                })
                .sort((a, b) => ordenCategoria(a[0]) - ordenCategoria(b[0]) || a[0].localeCompare(b[0], "es"));

            const todasCategorias = [...categoriasDam, ...categoriasCab]
                .sort((a, b) => compararCategoriasPremios(a[0], b[0]));

            todasCategorias.forEach(([cat, items]) => {
                html += renderPrintCategoria(cat, items);
            });

            html += renderPrintScratch("Scratch Damas", scratchDam, topScratchDam);
            html += renderPrintScratch("Scratch Caballeros", scratchCab, topScratchCab);

            html += `</div>`;

            if (serieActual) {
                html += renderPrintSeriesPage();
            }
            html += `<div class="print-page print-grid-page">${renderPrintMembrete("Grilla de anotados")}${renderPrintGrilla()}</div>`;
            const stats = calcularStatsTee(validas);
            html += `<div class="print-page print-holes-page">${renderPrintMembrete("Ranking y detalle por hoyo")}`;
            html += `<div class="print-section-title">Ranking de hoyos · Peor a mejor</div>${renderPrintRanking(stats)}`;
            html += `<div class="print-section-title">Detalle por hoyo</div><table class="print-hole-table"><thead><tr><th>Hoyo</th><th>Par</th><th>HCP</th><th>Prom.</th><th>Vs Par</th><th>Águilas</th><th>Birdies</th><th>Par</th><th>Bogey</th><th>Doble+</th></tr></thead><tbody>`;
            stats.forEach(r => html += `<tr><td>H${r.hole}</td><td>${r.par ?? "—"}</td><td>${r.hcp ?? "—"}</td><td>${fmt(r.avg, 2)}</td><td>${fmt(r.avgVsPar, 2)}</td><td>${r.eagle}</td><td>${r.birdie}</td><td>${r.parCount}</td><td>${r.bogey}</td><td>${r.doublePlus}</td></tr>`);
            html += `</tbody></table></div>`;
            el("printArea").innerHTML = html;
        }

        function renderPrintGrilla() {
            if (!grillaBloquesActuales?.length) {
                return `<div>No hay grilla disponible.</div>`;
            }

            let html = "";

            for (const b of grillaBloquesActuales) {
                html += `
                    <table class="print-grid-table">
                        <colgroup>
                            <col class="col-hora">
                            <col class="col-jugador">
                            <col class="col-jugador">
                            <col class="col-jugador">
                            <col class="col-jugador">
                        </colgroup>
                        <thead>
                            <tr>
                                <th colspan="5">
                                    ${esc(b.name || "Salida")}${b.start_time ? " · " + horaTexto(b.start_time) : ""}
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                const esSimultanea = String(torneoActual?.start_type || "")
                    .toLowerCase()
                    .includes("simult");

                const lineas = (b.starting_lines || []).sort((a, b) => {
                    if (esSimultanea) {
                        const hoyoA = Number(a.starting_hole || 0);
                        const hoyoB = Number(b.starting_hole || 0);

                        if (hoyoA !== hoyoB) return hoyoA - hoyoB;

                        const bisA = String(a.label || "").toLowerCase().includes("bis") ? 1 : 0;
                        const bisB = String(b.label || "").toLowerCase().includes("bis") ? 1 : 0;

                        return bisA - bisB;
                    }

                    return (a.display_order ?? 0) - (b.display_order ?? 0) ||
                        String(a.line_time || "").localeCompare(String(b.line_time || "")) ||
                        (a.starting_hole ?? 0) - (b.starting_hole ?? 0);
                });

                for (const linea of lineas) {
                    const esSimultanea = String(torneoActual?.start_type || "")
                        .toLowerCase()
                        .includes("simult");

                    let cabecera = "";

                    if (esSimultanea) {
                        const hoyo = linea.starting_hole ? Number(linea.starting_hole) : "";
                        const label = String(linea.label || "").toLowerCase();

                        const esBis = label.includes("bis");

                        cabecera = hoyo
                            ? `H${hoyo}${esBis ? " BIS" : ""}`
                            : (esBis ? "BIS" : "");
                    } else {
                        cabecera = linea.line_time
                            ? horaTexto(linea.line_time)
                            : (linea.starting_hole ? `H${linea.starting_hole}` : "");
                    }

                    const slots = (linea.line_slots || [])
                        .sort((a, b) => (a.slot_number || 0) - (b.slot_number || 0))
                        .map(slot => formatearNombreCorto(slot.display_name || ""));

                    while (slots.length < 4) slots.push("");

                    html += `
                        <tr>
                            <td>${esc(cabecera)}</td>
                            <td>${esc(slots[0])}</td>
                            <td>${esc(slots[1])}</td>
                            <td>${esc(slots[2])}</td>
                            <td>${esc(slots[3])}</td>
                        </tr>
                    `;
                }

                html += `
                        </tbody>
                    </table>
                `;
            }

            return html;
        }

        init();

        document.getElementById("btnHome").addEventListener("click", () => {
            window.location.href = "panel.html";
        });
    </script>
</body>

</html>
