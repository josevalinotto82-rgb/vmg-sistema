<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro VMGC Beta</title><link rel="stylesheet" href="vmgc_beta.css"></head><body class="auth-page"><main class="auth-panel"><section class="auth-card"><div class="auth-brand"><img class="club-logo auth-logo" src="escudo.png" alt="Escudo Villa María Golf Club"><div><strong>Villa María Golf Club</strong><div class="eyebrow">Registro de socio</div></div></div><h1>Creá tu cuenta</h1><p class="lead">Primero validamos que la matrícula corresponda a un socio VMGC.</p><div class="field"><label>Matrícula AAG</label><div style="display:flex;gap:8px"><input class="control" id="matricula" inputmode="numeric"><button class="btn secondary" id="validateButton" type="button">Validar</button></div></div><div id="playerBox" class="notice success form-status" hidden></div><form id="registerForm"><div class="field"><label>Email</label><input class="control" id="email" type="email" autocomplete="email"></div><div class="field"><label>Teléfono</label><input class="control" id="phone" inputmode="tel"></div><div class="field"><label>Contraseña</label><input class="control" id="password" type="password" minlength="6" autocomplete="new-password"></div><button class="btn primary" id="registerButton" type="submit">Registrarme</button></form><div id="formStatus" class="notice warn form-status" hidden></div><div class="auth-links"><a href="login_beta.html">← Volver al ingreso</a></div></section></main><aside class="auth-visual"><div class="auth-visual-copy"><h2>Tu lugar en la grilla, desde cualquier dispositivo.</h2><p>La cuenta queda vinculada a tu ficha de jugador sin modificar los datos oficiales de AAG.</p></div></aside><script type="module" src="js/register_page_beta.js"></script></body></html>
