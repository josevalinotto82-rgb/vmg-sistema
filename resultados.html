<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneos - Villa María Golf</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8f3;
            color: #1f2937;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        .hero {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            border-radius: 0 0 14px 14px;
            padding: 14px 18px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 18px;
        }

        .hero-link {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
        }

        .hero-link:hover {
            opacity: 0.96;
        }

        .escudo {
            height: 56px;
            width: auto;
            display: block;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .escudo:hover {
            transform: scale(1.05);
        }

        .club-title {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.1;
            color: #3e5740;
        }

        .club-subtitle {
            margin: 4px 0 0;
            color: #6b7280;
            font-size: 15px;
        }

        .tools {
            display: grid;
            grid-template-columns: 1fr 180px 180px;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tools input,
        .tools select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            background: white;
            color: #1f2937;
            outline: none;
        }

        .tools input:focus,
        .tools select:focus {
            border-color: #3e5740;
        }

        .status {
            margin-bottom: 16px;
            color: #6b7280;
            font-size: 14px;
        }

        .lista {
            display: grid;
            gap: 14px;
        }

        .torneo {
            background: white;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .torneo-info {
            min-width: 0;
            flex: 1;
        }

        .fecha {
            display: inline-block;
            font-size: 13px;
            color: #166534;
            background: #dcfce7;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .nombre {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.25;
            text-transform: uppercase;
        }

        .modalidad {
            color: #6b7280;
            font-size: 15px;
        }

        .ver-btn {
            border: none;
            background: #166534;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            white-space: nowrap;
            font-size: 14px;
        }

        .ver-btn:hover {
            background: #14532d;
        }

        .empty {
            background: white;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            color: #6b7280;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        @media (max-width: 920px) {
            .tools {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .container {
                padding: 0 12px 32px;
            }

            .hero {
                padding: 12px 14px;
            }

            .hero-link {
                gap: 12px;
            }

            .escudo {
                height: 50px;
            }

            .club-title {
                font-size: 21px;
            }

            .club-subtitle {
                font-size: 14px;
            }

            .torneo {
                flex-direction: column;
                align-items: stretch;
            }

            .ver-btn {
                width: 100%;
            }
        }
    </style>
<script src="./snapshot-client.js"></script>
</head>

<body>

    <div class="container">

        <div class="hero">
            <a href="https://villamariagolf.com.ar" target="_blank" class="hero-link">
                <img src="escudo.png" alt="Escudo Villa María Golf" class="escudo">
                <div>
                    <h1 class="club-title">Villa María Golf Club</h1>
                    <p class="club-subtitle">Resultados de torneos</p>
                </div>
            </a>
        </div>

        <div class="tools">
            <input type="text" id="buscador" placeholder="Buscar torneo...">
            <select id="filtroAnio">
                <option value="">Todos los años</option>
            </select>
            <select id="filtroDia">
                <option value="">Todos los días</option>
                <option value="0">Domingo</option>
                <option value="1">Lunes</option>
                <option value="2">Martes</option>
                <option value="3">Miércoles</option>
                <option value="4">Jueves</option>
                <option value="5">Viernes</option>
                <option value="6">Sábado</option>
            </select>
        </div>

        <div id="status" class="status">Cargando torneos...</div>
        <div id="lista" class="lista"></div>

    </div>

    <script type="module">
        import { createClient as createRawClient } from "https://esm.sh/@supabase/supabase-js@2";
const createClient = (...args) => globalThis.VMGCSnapshot.wrapClient(createRawClient(...args));

        const supabase = createClient(
            "https://bnnfolhrqxgxjmobclrm.supabase.co",
            "sb_publishable_pNxU4AFpAZPpeJ0wICLvIw_6nW90njQ"
        );



            let torneos = [];
            let jugadoresIndexados = [];
            let indiceJugadoresPromise = null;
            let indiceJugadoresListo = false;
            let errorIndiceJugadores = false;
            let cargandoTorneos = true;
            let temporizadorBusqueda;

        // Rangos inclusivos y orden estable: no truncar al límite de la API.
        async function consultarTodas(crearConsulta) {
            const filas = [];
            const limite = 500;
            for (let desde = 0; ; desde += limite) {
                const { data, error } = await crearConsulta().range(desde, desde + limite - 1);
                if (error) throw error;
                filas.push(...(data || []));
                if (!data || data.length < limite) return { data: filas, error: null };
            }
        }

            function escaparHTML(valor) {
                return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
            }
            async function cargarIndicePaginas() {
                const limite = 500;
                const consulta = (contar = false) => supabase.from('scorecards')
                    .select('tournament_id,display_name,tournaments!inner(id)', contar ? { count: 'exact' } : {})
                    .eq('tournaments.data_schema_version', 2)
                    .eq('tournaments.published', true)
                    .in('tournaments.status', ['officialized', 'archived'])
                    .order('id', { ascending: true });
                const primera = await consulta(true).range(0, limite - 1);
                if (primera.error) throw primera.error;
                const paginas = [primera.data || []];
                if (primera.count == null) {
                    // Si la API omite el conteo, seguir paginando sin truncar.
                    while (paginas.at(-1).length === limite) {
                        const desde = paginas.length * limite;
                        const res = await consulta().range(desde, desde + limite - 1);
                        if (res.error) throw res.error;
                        paginas.push(res.data || []);
                    }
                } else {
                    const totalPaginas = Math.ceil(primera.count / limite);
                    let siguiente = 1;
                    await Promise.all(Array.from({ length: Math.min(4, Math.max(0, totalPaginas - 1)) }, async () => {
                        while (siguiente < totalPaginas) {
                            const pagina = siguiente++;
                            const desde = pagina * limite;
                            const res = await consulta().range(desde, desde + limite - 1);
                            if (res.error) throw res.error;
                            paginas[pagina] = res.data || [];
                        }
                    }));
                }
                return paginas.flat();
            }
            async function asegurarIndiceJugadores() {
                if (indiceJugadoresListo) return;
                if (indiceJugadoresPromise) return indiceJugadoresPromise;
                errorIndiceJugadores = false;
                indiceJugadoresPromise = (async () => {
                    // Cargar sólo tarjetas de torneos v2 publicados, al buscar.
                    const data = await cargarIndicePaginas();
                    construirIndiceJugadores(data);
                    indiceJugadoresListo = true;
                })();
                try { await indiceJugadoresPromise; }
                catch (error) { errorIndiceJugadores = true; console.warn('No se pudo cargar la búsqueda por jugador:', error); }
                finally { indiceJugadoresPromise = null; renderTorneos(); }
            }


            function normalizarTexto(texto) {
                return String(texto || "")
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/[,.;:()]/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            }

            function separarPalabras(texto) {
                return normalizarTexto(texto)
                    .split(" ")
                    .filter(Boolean);
            }

            function fechaAObjeto(fecha) {
                const texto = String(fecha || "").trim();
                if (!texto) return null;

                const partes = texto.split("-"); // YYYY-MM-DD

                if (partes.length === 3) {
                    const [yyyy, mm, dd] = partes;
                    return new Date(
                        Number(yyyy),
                        Number(mm) - 1,
                        Number(dd)
                    );
                }

                const f = new Date(texto);
                return Number.isNaN(f.getTime()) ? null : f;
            }

            function formatearFecha(fecha) {
                const f = fechaAObjeto(fecha);
                if (!f) return String(fecha || "");

                const dd = String(f.getDate()).padStart(2, "0");
                const mm = String(f.getMonth() + 1).padStart(2, "0");
                const yyyy = String(f.getFullYear());

                return `${dd}/${mm}/${yyyy}`;
            }

            function extraerAnio(fecha) {
                const f = fechaAObjeto(fecha);
                return f ? String(f.getFullYear()) : "";
            }

            function obtenerDiaSemana(fecha) {
                const f = fechaAObjeto(fecha);
                if (!f) return "";
                return String(f.getDay());
            }

            function textoContador(cantidad) {
                return cantidad === 1 ? "1 torneo encontrado" : `${cantidad} torneos encontrados`;
            }

            function construirIndiceJugadores(scorecards) {
                const mapa = new Map();

                scorecards.forEach(s => {
                    const nombreOriginal = String(s.display_name || "").trim();
                    const nombreNormalizado = normalizarTexto(nombreOriginal);
                    const tournamentId = s.tournament_id;

                    if (!nombreNormalizado || !tournamentId) return;

                    if (!mapa.has(nombreNormalizado)) {
                        mapa.set(nombreNormalizado, {
                            nombre: nombreNormalizado,
                            ids: new Set()
                        });
                    }

                    mapa.get(nombreNormalizado).ids.add(tournamentId);
                });

                jugadoresIndexados = Array.from(mapa.values());
            }

            function buscarIdsPorJugador(textoBusqueda) {

                const palabras = separarPalabras(textoBusqueda);

                const ids = new Set();

                if (palabras.length === 0) return ids;

                jugadoresIndexados.forEach(j => {

                    const coincide = palabras.every(palabra =>
                        j.nombre.includes(palabra)
                    );

                    if (coincide) {
                        j.ids.forEach(id => ids.add(id));
                    }
                });

                return ids;
            }

            async function renderTorneos() {
                if (cargandoTorneos) return;
                const textoOriginal = document.getElementById("buscador").value;
                const texto = normalizarTexto(textoOriginal);
                const anio = document.getElementById("filtroAnio").value;
                const dia = document.getElementById("filtroDia").value;
                const lista = document.getElementById("lista");
                const status = document.getElementById("status");

                let idsJugador = new Set();

                if (texto) {
                    idsJugador = buscarIdsPorJugador(texto);
                }

                const filtrados = torneos.filter(t => {
                    const nombre = normalizarTexto(t.name);
                    const modalidad = normalizarTexto(t.game_modes?.name || "");
                    const fecha = normalizarTexto(formatearFecha(t.tournament_date));

                    const coincideTextoDirecto =
                        !texto ||
                        nombre.includes(texto) ||
                        modalidad.includes(texto) ||
                        fecha.includes(texto);

                    const coincideJugador =
                        !texto ||
                        idsJugador.has(t.id);

                    const coincideBusqueda = !texto || coincideTextoDirecto || coincideJugador;
                    const coincideAnio = !anio || extraerAnio(t.tournament_date) === anio;
                    const coincideDia = !dia || obtenerDiaSemana(t.tournament_date) === dia;

                    return coincideBusqueda && coincideAnio && coincideDia;
                });

                status.textContent = textoContador(filtrados.length) +
                    (texto && !indiceJugadoresListo
                        ? (errorIndiceJugadores ? ' · No se pudo buscar por jugador; volvé a escribir para reintentar.' : ' · Buscando también por jugador...')
                        : '');

                if (filtrados.length === 0) {
                    lista.innerHTML = `<div class="empty">No se encontraron torneos con esos filtros.</div>`;
                    return;
                }

                lista.innerHTML = filtrados.map(t => `
      <div class="torneo">
        <div class="torneo-info">
          <div class="fecha">${formatearFecha(t.tournament_date)}</div>
          <div class="nombre">${escaparHTML(t.name)}</div>
          <div class="modalidad">${escaparHTML(t.game_modes?.name || "")}</div>
        </div>
        <button class="ver-btn" data-id="${t.id}">Ver resultados</button>
      </div>
    `).join("");

            }
            document.getElementById('lista').addEventListener('click', event => {
                const boton = event.target.closest('.ver-btn');
                if (!boton) return;
                const q = document.getElementById('buscador').value || '';
                window.location.href = 'torneos.html?id=' + encodeURIComponent(boton.dataset.id) + '&q=' + encodeURIComponent(q);
            });
            async function cargar() {
                const status = document.getElementById("status");

                try {
                    status.textContent = "Cargando torneos...";

                    // =========================
                    // TODOS LOS TORNEOS V2 PUBLICADOS
                    // Los torneos históricos ya fueron migrados a esta tabla.
                    // =========================

                    const { data: torneosData, error: errorTorneos } = await consultarTodas(() => supabase
                        .from("tournaments")
                        .select(`
              id,
              name,
              tournament_date,
              game_mode_id,
              status,
              game_modes (
                  id,
                  name
              )
          `)
                        .in("status", ["officialized", "archived"])
                        .eq("data_schema_version", 2)
                        .eq("published", true)
                        .order("tournament_date", { ascending: false }).order("id", { ascending: true }));

                    if (errorTorneos) throw errorTorneos;

                    // =========================
                    // Sólo torneos v2 para la lista inicial.
                    // NORMALIZAR TORNEOS V2
                    // =========================

                    torneos = (torneosData || []).map(t => ({
                        id: t.id,
                        name: t.name,
                        tournament_date: t.tournament_date,
                        game_modes: {
                            name: t.game_modes?.name || ""
                        }
                    }));

                    // =========================
                    // ORDENAR POR FECHA
                    // =========================

                    torneos.sort((a, b) => {
                        const fa = fechaAObjeto(a.tournament_date);
                        const fb = fechaAObjeto(b.tournament_date);

                        if (!fa || !fb) return 0;

                        return fb - fa;
                    });

                    // =========================
                    // INDICE DE JUGADORES
                    // =========================

                    // El índice de jugadores se carga al usar el buscador.

                    // =========================
                    // FILTRO AÑOS
                    // =========================

                    const anios = [...new Set(
                        torneos
                            .map(t => extraerAnio(t.tournament_date))
                            .filter(Boolean)
                    )].sort((a, b) => b.localeCompare(a));

                    const filtroAnio = document.getElementById("filtroAnio");

                    filtroAnio.innerHTML =
                        `<option value="">Todos los años</option>` +
                        anios.map(a => `<option value="${a}">${a}</option>`).join("");

                    cargandoTorneos = false;
                    await renderTorneos();
                    if (document.getElementById('buscador').value.trim()) void asegurarIndiceJugadores();

                } catch (err) {

                    cargandoTorneos = false;
                    console.error(err);

                    status.textContent =
                        "Error: " +
                        (err.message || "No se pudieron cargar los torneos.");

                    document.getElementById("lista").innerHTML =
                        `<div class="empty">No se pudieron cargar los torneos.</div>`;
                }
            }

            document.getElementById("buscador").addEventListener("input", () => {
                clearTimeout(temporizadorBusqueda);
                temporizadorBusqueda = setTimeout(() => {
                    renderTorneos();
                    if (!cargandoTorneos && document.getElementById('buscador').value.trim()) void asegurarIndiceJugadores();
                }, 200);
            });

            document.getElementById("filtroAnio").addEventListener("change", () => {
                renderTorneos();
            });

            document.getElementById("filtroDia").addEventListener("change", () => {
                renderTorneos();
            });

            cargar();
        </script>
</body>

</html>
